  victoria:
    image: "victoriametrics/victoria-metrics"
    container_name: prom
    environment:
      - no_proxy=localhost,127.0.0.1,victoria,grafana,sensu,172.*
      - NO_PROXY=localhost,127.0.0.1,victoria,grafana,sensu,172.*
    command:
      - -promscrape.config=/etc/prometheus/prometheus.yml
      - --loggerLevel=INFO
    ports: 
      - "8428:8428"
    volumes:
      - ./out/victoria-metrics-data:/victoria-metrics-data
      - ./out/prometheus:/etc/prometheus

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    environment:
      - no_proxy=localhost,127.0.0.1,victoria,sensu,172.*
      - NO_PROXY=localhost,127.0.0.1,victoria,sensu,172.*
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=sensu-go-datasource
    restart: unless-stopped
    user: '0'
    ports:
     - '4000:3000'
    volumes:
      - ./out/.grafana-storage:/var/lib/grafana

volumes:
  redis_data:
    driver: local

networks:
  courier-net:
    driver: bridge
