services:
  redis:
    image: redis:alpine
    container_name: courier-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - courier-net
    restart: unless-stopped

  redis-exporter:
    image: "oliver006/redis_exporter"
    container_name: redis_exp 
    ports: 
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
  
