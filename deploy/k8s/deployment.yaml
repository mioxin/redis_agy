apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-location-service
  labels:
    app.kubernetes.io/name: courier-location-service
    app.kubernetes.io/part-of: courier-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: courier-location-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: courier-location-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: courier-service
          image: courier-location-service:v2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "redis-service:6379"
            - name: SLA_LIMIT
              value: "100ms"
            - name: POLL_INTERVAL
              value: "30s"
            - name: WORKER_CONCURRENCY
              value: "10"
            - name: LEADER_LOCK_TTL
              value: "25s"
            - name: LEADER_RENEW_INTERVAL
              value: "10s"
            - name: CIRCUIT_BREAKER_MAX_FAILURES
              value: "5"
            - name: CIRCUIT_BREAKER_TIMEOUT
              value: "15s"
            - name: PPROF_ENABLED
              value: "true"
            - name: BLOCK_PROFILE_RATE
              value: "10000"
            - name: MUTEX_PROFILE_FRACTION
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: courier-location-service
  labels:
    app.kubernetes.io/name: courier-location-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: courier-location-service
  ports:
    - name: http
      port: 8080
      targetPort: http
